{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AskAI • Smart System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <!-- Prism.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 40%, #bae6fd 100%);
      min-height: 100vh;
    }

    .chat-container { max-width: 860px; margin: 0 auto; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 40px 20px 140px;
      scroll-behavior: smooth;
    }

    .message {
      animation: fadeInUp 0.4s ease forwards;
      margin-bottom: 28px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-message {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
      border-radius: 20px 20px 4px 20px;
      padding: 15px 20px;
      max-width: 75%;
      align-self: flex-end;
    }

    .assistant-message {
      background: white;
      border: 1px solid #e0f2fe;
      color: #1e2937;
      border-radius: 20px 20px 20px 4px;
      padding: 15px 20px;
      max-width: 80%;
      align-self: flex-start;
      box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.08);
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #f1f5f9;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0.7;
    }

    .copy-btn:hover { opacity: 1; background: #e2e8f0; }

    pre {
      background: #1e2937 !important;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 12px 0;
      position: relative;
    }

    .code-copy-btn {
      position: absolute;
      margin-top: 2px;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.25);
      color: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.05rem;
    }

    .code-copy-btn:hover {
      background: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50 py-4">
    <div class="chat-container px-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="{% static 'img/Smart-System-Logo.webp' %}" 
             alt="Smart System" 
             class="h-10 w-fit object-contain">
      </div>

      <div class="flex items-center gap-6">
        <a href="{% url 'home' %}" class="flex items-center gap-2 text-slate-600 hover:text-blue-600 font-medium">
          <i class="fa-solid fa-house"></i>
          <span>Home</span>
        </a>

        <button onclick="clearChat()" 
                class="flex items-center gap-2 px-5 py-2 text-slate-600 hover:bg-red-50 hover:text-red-600 rounded-xl transition-all">
          <i class="fa-solid fa-trash"></i>
          <span>Clear Chat</span>
        </button>
      </div>

      <div class="text-right">
        <p class="text-xs text-slate-400">Powered by</p>
        <p class="font-semibold text-blue-700">Eng. Aziz</p>
      </div>
    </div>
  </header>

  <!-- Chat Area -->
  <div id="chat" class="flex-1 flex flex-col chat-container">
    <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center text-center px-6 py-20">
      <div class="w-24 h-24 bg-blue-100 rounded-3xl flex items-center justify-center mb-6">
        <i class="fa-solid fa-bolt-lightning text-6xl text-blue-600"></i>
      </div>
      <h2 class="text-4xl font-semibold text-slate-700 mb-2">AskAI Assistant</h2>
      <p class="text-slate-500">How can I help you today?</p>
    </div>
  </div>

  <!-- Input Area -->
  <div class="bg-white/95 backdrop-blur-xl border-t border-slate-200 py-6 sticky bottom-0 z-40">
    <div class="chat-container px-6">
      <form id="prompt-form" class="relative">
        <textarea 
          id="prompt-input"
          rows="1"
          class="w-full bg-white border border-slate-300 focus:border-blue-500 rounded-3xl py-5 px-7 pr-20 text-base resize-y min-h-[58px] max-h-52 shadow-sm focus:outline-none"
          placeholder="Type your message here... (Enter to send)"
        ></textarea>
        
        <button 
          type="submit"
          id="send-btn"
          class="absolute bottom-4 right-4 bg-blue-600 hover:bg-blue-700 text-white w-11 h-11 rounded-2xl flex items-center justify-center transition-all">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const chat = document.getElementById('chat');
      const form = document.getElementById('prompt-form');
      const input = document.getElementById('prompt-input');
      const sendBtn = document.getElementById('send-btn');
      const welcomeScreen = document.getElementById('welcome-screen');

      let isProcessing = false;

      // Improved Auto Scroll Function
      function scrollToBottom(smooth = true) {
        setTimeout(() => {
          if (smooth) {
            chat.scrollTo({
              top: chat.scrollHeight,
              behavior: 'smooth'
            });
          } else {
            chat.scrollTop = chat.scrollHeight;
          }
        }, 50); // Small delay ensures DOM is updated
      }

      function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function addMessage(role, content = '') {
        const div = document.createElement('div');
        div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} message`;

        if (role === 'user') {
          div.innerHTML = `
            <div class="user-message relative group">
              <div class="message-content">${content.replace(/\n/g, '<br>')}</div>
              <button onclick="copyMessage(this)" class="copy-btn hidden group-hover:block">
                <i class="fas fa-copy"></i>
              </button>
            </div>
          `;
        } else {
          let formattedContent = content
            .replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
              const language = lang || 'plaintext';
              return `
                <div class="relative my-3">
                  <pre><code class="language-${language}">${escapeHtml(code.trim())}</code></pre>
                  <button onclick="copyCode(this)" class="code-copy-btn">
                    <i class="fas fa-copy"></i>
                  </button>
                </div>`;
            })
            .replace(/\n/g, '<br>');

          div.innerHTML = `
            <div class="assistant-message relative group">
              <div class="flex items-center gap-3 mb-3">
                <img src="{% static 'img/UICGR.jpg' %}" alt="AI" class="w-15 h-7 rounded-xl">
                <span class="font-medium text-slate-700">Smart AI</span>
              </div>
              <div class="message-content prose prose-slate max-w-none">${formattedContent}</div>
              <button onclick="copyMessage(this)" class="copy-btn hidden group-hover:block">
                <i class="fas fa-copy"></i>
              </button>
            </div>
          `;
        }

        chat.appendChild(div);
        scrollToBottom(true);   // Smooth scroll
        if (role === 'assistant') Prism.highlightAllUnder(div);
        return div;
      }

      window.copyMessage = function(btn) {
        const content = btn.parentElement.querySelector('.message-content').innerText;
        navigator.clipboard.writeText(content).then(() => {
          const original = btn.innerHTML;
          btn.innerHTML = '<i class="fas fa-check text-green-500"></i>';
          setTimeout(() => btn.innerHTML = original, 1800);
        });
      };

      window.copyCode = function(btn) {
        const code = btn.parentElement.querySelector('code').innerText;
        navigator.clipboard.writeText(code).then(() => {
          const original = btn.innerHTML;
          btn.innerHTML = '<i class="fas fa-check text-green-400"></i>';
          setTimeout(() => btn.innerHTML = original, 1800);
        });
      };

      function showTypingIndicator() {
        const div = document.createElement('div');
        div.id = 'typing-indicator';
        div.className = `flex justify-start message`;
        div.innerHTML = `
          <div class="assistant-message">
            <div class="flex items-center gap-3 mb-3">
              <img src="{% static 'img/UICGR.jpg' %}" alt="AI" class="w-15 h-7 rounded-xl">
              <span class="font-medium text-slate-700">Smart AI</span>
            </div>
            <div class="flex gap-1">
              <span class="w-2 h-2 bg-slate-500 rounded-full animate-bounce"></span>
              <span class="w-2 h-2 bg-slate-500 rounded-full animate-bounce" style="animation-delay:150ms"></span>
              <span class="w-2 h-2 bg-slate-500 rounded-full animate-bounce" style="animation-delay:300ms"></span>
            </div>
          </div>
        `;
        chat.appendChild(div);
        scrollToBottom(false);   // Instant scroll for typing
        return div;
      }

      async function sendMessage() {
        if (isProcessing) return;
        const message = input.value.trim();
        if (!message) return;

        isProcessing = true;
        sendBtn.disabled = true;
        sendBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;

        if (welcomeScreen) welcomeScreen.style.display = 'none';

        addMessage('user', message);
        input.value = '';

        const typingIndicator = showTypingIndicator();

        try {
          const response = await fetch('/ask/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
          });

          typingIndicator.remove();

          let assistantDiv = null;
          let fullText = '';

          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');

            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const data = line.slice(6);
                if (data === '[DONE]') continue;

                try {
                  const parsed = JSON.parse(data);
                  if (parsed.content) {
                    fullText += parsed.content;

                    if (!assistantDiv) {
                      assistantDiv = addMessage('assistant', fullText);
                    } else {
                      const contentEl = assistantDiv.querySelector('.message-content');
                      if (contentEl) {
                        let formatted = fullText
                          .replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                            const language = lang || 'plaintext';
                            return `
                              <div class="relative my-3">
                                <pre><code class="language-${language}">${escapeHtml(code.trim())}</code></pre>
                                <button onclick="copyCode(this)" class="code-copy-btn">
                                  <i class="fas fa-copy"></i>
                                </button>
                              </div>`;
                          })
                          .replace(/\n/g, '<br>');
                        contentEl.innerHTML = formatted;
                      }
                    }
                    scrollToBottom(true);
                  }
                } catch (e) {}
              }
            }
          }
        } catch (error) {
          typingIndicator.remove();
          addMessage('assistant', 'Sorry, something went wrong. Please try again.');
        } finally {
          isProcessing = false;
          sendBtn.disabled = false;
          sendBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i>`;
        }
      }

      form.addEventListener('submit', (e) => { e.preventDefault(); sendMessage(); });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 180) + 'px';
      });

      window.clearChat = () => {
        if (confirm("Clear the conversation?")) {
          chat.innerHTML = '';
          chat.appendChild(document.getElementById('welcome-screen').cloneNode(true));
        }
      };

      // Focus input
      input.focus();
    });
  </script>
</body>
</html>
