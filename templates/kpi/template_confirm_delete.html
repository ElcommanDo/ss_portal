{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<div class="container-fluid px-4 py-5 d-flex justify-content-center align-items-center animate__animated animate__fadeIn" style="min-height: 70vh;">
    <div class="card border-0 shadow-lg p-4 text-center" style="max-width: 500px; border-radius: 20px;">
        <div class="card-body">
            <div class="text-danger mb-4 animate__animated animate__headShake animate__infinite animate__slow">
                <i class="fas fa-exclamation-triangle fa-4x"></i>
            </div>
            
            <h2 class="fw-bold text-dark mb-3">Delete KPI Template</h2>
            <p class="text-muted fs-6 mb-4">
                Are you sure you want to permanently delete <br>
                <strong class="text-danger">"{{ object.description|truncatewords:8 }}"</strong>? <br>
                This action cannot be undone.
            </p>
            
            <form method="post" class="d-flex justify-content-center gap-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4 py-2 rounded-pill fw-bold shadow-sm">
                    <i class="fas fa-trash-alt me-2"></i>Yes, Delete
                </button>
                <a href="{% url 'kpi_template_list' %}" class="btn btn-light border px-4 py-2 rounded-pill fw-bold text-muted">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>

<style>
    /* تحسينات إضافية على الأزرار للتفاعل */
    .btn-danger { transition: transform 0.2s ease; }
    .btn-danger:hover { transform: scale(1.03); }
    .btn-light:hover { background-color: #f8f9fa; color: #212529 !important; }
</style>
{% endblock %}
