{% extends 'base.html' %}
{% block content %}
<h1 class="mb-4">Delete KPI Template</h1>
<p>Are you sure you want to delete "{{ object.description }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'kpi_template_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
