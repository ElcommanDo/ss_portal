{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Timesheet App{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<style>
/* Preloader Styles (Kept inline as requested) */
#preloader {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: #ffffff; /* White background */
z-index: 9999;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
transition: opacity 0.5s ease-out;
}
.preloader-logo { width: 80px; animation: pulse 2s infinite; } /* Example animation */
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
.hidden { opacity: 0; visibility: hidden; }
        /* Utility class to create spacing for the fixed header */
        .pt-6 { padding-top: 5rem !important; }
</style>
</head>
<body>
<div id="preloader">
<img src="{% static 'img/Smart-System-Logo.webp' %}" alt="Loading..." class="preloader-logo">
<p class="mt-3 text-muted">Loading Application...</p>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm fixed-top" style="z-index: 1030;">
<div class="container-fluid">
<a class="navbar-brand" href="{% url 'home' %}">
<img src="{% static 'img/Smart-System-Logo.webp' %}" alt="Logo" height="24" class="d-inline-block align-text-top me-2">
</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
<i class="fas fa-bars text-white"></i> 
</button>

<div class="collapse navbar-collapse" id="navbarNav">
<ul style="font-weight: bolder;" class="navbar-nav me-auto mb-2 mb-lg-0">
<li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="{%url 'add_timesheet' %}">Add Task</a></li>
<li class="nav-item"><a class="nav-link" href="{%url 'projects' %}">Projects</a></li>
</ul>

<ul class="navbar-nav mb-2 mb-lg-0">
<li class="nav-item d-flex align-items-center">
 <span class="navbar-text me-3 text-light">
Welcome, **{{ request.user.username }}**
 </span>
</li>

<li class="nav-item dropdown me-2">
<a class="nav-link dropdown-toggle" href="#" id="accountDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
<i class="fas fa-user-circle fa-lg text-white"></i> 
</a>
<ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accountDropdown">
<li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
<i class="fas fa-key me-2"></i> Change Password
</a></li>
</ul>
</li>

<li class="nav-item">
<a href="{%url 'logout' %}" class="btn btn-outline-light">Logout</a>
</li>
</ul>
</div>
</div>
</nav>

<main class="container">

{% block content %}

{% endblock %}
</main>

<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title" id="changePasswordModalLabel">Change Password</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form id="changePasswordForm" method="post" action="{% url 'change_password' %}">
    {%csrf_token%}
<div class="modal-body">
<div class="mb-3">
<label for="oldPassword" class="form-label">Old Password</label>
<input type="password" class="form-control" id="oldPassword" name="old_password" required>
</div>
<div class="mb-3">
<label for="newPassword" class="form-label">New Password</label>
<input type="password" class="form-control" id="newPassword" name="new_password" required>
</div>
<div class="mb-3">
<label for="confirmNewPassword" class="form-label">Confirm New Password</label>
<input type="password" class="form-control" id="confirmNewPassword" name="confirm_new_password" required>
<div id="passwordMatchFeedback" class="mt-2" style="font-size: 0.875em;"></div>
</div>
</div>
<div class="modal-footer">
<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
<button type="submit" class="btn btn-primary" id="changePasswordSubmitBtn" disabled>Save Changes</button>
</div>
</form>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// --- Preloader Script ---
window.addEventListener('load', function() {
const preloader = document.getElementById('preloader');
preloader.classList.add('hidden');
});

// --- Password Validation Script ---

const changePasswordForm = document.getElementById('changePasswordForm');
const newPasswordInput = document.getElementById('newPassword');
const confirmNewPasswordInput = document.getElementById('confirmNewPassword');
const feedbackDiv = document.getElementById('passwordMatchFeedback');
const submitBtn = document.getElementById('changePasswordSubmitBtn');

function validatePasswords() {
const newPassword = newPasswordInput.value;
const confirmNewPassword = confirmNewPasswordInput.value;

// Reset feedback
feedbackDiv.innerHTML = '';
feedbackDiv.classList.remove('text-danger', 'text-success');
submitBtn.disabled = true;

// Only validate if both fields have content
if (newPassword.length > 0 && confirmNewPassword.length > 0) {
if (newPassword === confirmNewPassword) {
// SUCCESS: Passwords match
feedbackDiv.innerHTML = '<i class="fas fa-check-circle"></i> Passwords match.';
feedbackDiv.classList.add('text-success');
submitBtn.disabled = false; // Enable submission
} else {
// ERROR: Passwords do not match
feedbackDiv.innerHTML = '<i class="fas fa-times-circle"></i> Passwords do not match.';
feedbackDiv.classList.add('text-danger'); 
}
}
}

// Attach real-time validation to keyup events
newPasswordInput.addEventListener('keyup', validatePasswords);
confirmNewPasswordInput.addEventListener('keyup', validatePasswords);


// Final client-side validation on form submission
changePasswordForm.addEventListener('submit', function(e) {
// Re-run validation logic just before submit
if (newPasswordInput.value !== confirmNewPasswordInput.value) {
e.preventDefault(); // Stop form submission
feedbackDiv.innerHTML = '<i class="fas fa-times-circle"></i> New passwords must match to submit.';
feedbackDiv.classList.remove('text-success');
feedbackDiv.classList.add('text-danger');
}
});


// Reset the form and feedback when the modal is closed
const changePasswordModal = document.getElementById('changePasswordModal');
changePasswordModal.addEventListener('hidden.bs.modal', function () {
changePasswordForm.reset();
feedbackDiv.innerHTML = '';
feedbackDiv.classList.remove('text-danger', 'text-success');
submitBtn.disabled = true;
});
</script>
</body>
</html>
