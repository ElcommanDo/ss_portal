{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Timesheet System{% endblock %}</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Your enhanced CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        /* Preloader */
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--background-color);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease-out;
        }
        .preloader-logo {
            width: 90px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .hidden { opacity: 0; visibility: hidden; }
    </style>
</head>

<body data-bs-theme="light">

<!-- ==================== PRELOADER ==================== -->
<div id="preloader">
    <img src="{% static 'img/Smart-System-Logo.webp' %}" alt="Loading..." class="preloader-logo">
    <p class="mt-3 fw-bold">Smart System • Loading...</p>
</div>

<!-- ==================== NAVBAR ==================== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm fixed-top" style="z-index: 1030;">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'home' %}">
            <img src="{% static 'img/Smart-System-Logo.webp' %}" alt="Logo" height="32" class="me-2">
            
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <i class="fas fa-bars text-white"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}"><i class="fas fa-home me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="{%url 'add_timesheet' %}"><i class="fas fa-plus me-1"></i>Add Task</a></li>
                <li class="nav-item"><a class="nav-link" href="{%url 'projects' %}"><i class="fas fa-briefcase me-1"></i>Projects</a></li>
            </ul>

            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item d-flex align-items-center me-3">
                    <span class="navbar-text text-light fw-bold">Welcome, {{ request.user.username }}</span>
                </li>

                <!-- User Avatar in Navbar -->
                <li class="nav-item dropdown me-2">
                    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="accountDropdown" role="button" data-bs-toggle="dropdown">
                        <img src="https://ui-avatars.com/api/?name={{ request.user.username }}&background=6366f1&color=fff&size=36&rounded=true" 
                             alt="{{ request.user.username }}" 
                             class="rounded-circle border border-3 border-white shadow-sm"
                             style="width: 36px; height: 36px; object-fit: cover;">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accountDropdown">
                        <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
                            <i class="fas fa-key me-2"></i> Change Password
                        </a></li>
                          <li >
                    <a href="{%url 'logout' %}" class="dropdown-item">
                           <i class="fas fa-sign-out"></i>
                      
                        Logout
                    </a>
                </li>
                    </ul>
                </li>

              
            </ul>
        </div>
    </div>
</nav>

<!-- ==================== MAIN CONTENT ==================== -->
<main class="container pt-4">
    {% block content %}{% endblock %}
</main>

<!-- ==================== CHANGE PASSWORD MODAL ==================== -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="changePasswordModalLabel">Change Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="changePasswordForm" method="post" action="{% url 'change_password' %}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="oldPassword" class="form-label">Old Password</label>
                        <input type="password" class="form-control" id="oldPassword" name="old_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="newPassword" name="new_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirmNewPassword" name="confirm_new_password" required>
                        <div id="passwordMatchFeedback" class="mt-2" style="font-size: 0.875em;"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary" id="changePasswordSubmitBtn" disabled>Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ==================== SCRIPTS ==================== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ==================== PRELOADER (Fixed) ====================
window.addEventListener('load', function() {
    const preloader = document.getElementById('preloader');
    preloader.classList.add('hidden');
    setTimeout(() => {
        preloader.style.display = 'none';
    }, 600);
});

// ==================== PASSWORD VALIDATION ====================
const changePasswordForm = document.getElementById('changePasswordForm');
const newPasswordInput = document.getElementById('newPassword');
const confirmNewPasswordInput = document.getElementById('confirmNewPassword');
const feedbackDiv = document.getElementById('passwordMatchFeedback');
const submitBtn = document.getElementById('changePasswordSubmitBtn');

function validatePasswords() {
    const newPassword = newPasswordInput.value;
    const confirmNewPassword = confirmNewPasswordInput.value;

    feedbackDiv.innerHTML = '';
    feedbackDiv.classList.remove('text-danger', 'text-success');
    submitBtn.disabled = true;

    if (newPassword.length > 0 && confirmNewPassword.length > 0) {
        if (newPassword === confirmNewPassword) {
            feedbackDiv.innerHTML = '<i class="fas fa-check-circle"></i> Passwords match.';
            feedbackDiv.classList.add('text-success');
            submitBtn.disabled = false;
        } else {
            feedbackDiv.innerHTML = '<i class="fas fa-times-circle"></i> Passwords do not match.';
            feedbackDiv.classList.add('text-danger');
        }
    }
}

newPasswordInput.addEventListener('keyup', validatePasswords);
confirmNewPasswordInput.addEventListener('keyup', validatePasswords);

changePasswordForm.addEventListener('submit', function(e) {
    if (newPasswordInput.value !== confirmNewPasswordInput.value) {
        e.preventDefault();
        feedbackDiv.innerHTML = '<i class="fas fa-times-circle"></i> New passwords must match to submit.';
        feedbackDiv.classList.add('text-danger');
    }
});

// Reset modal when closed
const changePasswordModal = document.getElementById('changePasswordModal');
changePasswordModal.addEventListener('hidden.bs.modal', function () {
    changePasswordForm.reset();
    feedbackDiv.innerHTML = '';
    feedbackDiv.classList.remove('text-danger', 'text-success');
    submitBtn.disabled = true;
});
</script>

</body>
</html>
