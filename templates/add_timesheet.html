{% extends 'base.html' %}
{% load static %}

{% block title %}Add Timesheet Task{% endblock %}

{% block content %}
<style>
    /* Large modern toggle switch */
    .form-check-input:checked {
        background-color: #198754; 
        border-color: #198754;
    }
    .custom-switch-lg .form-check-input {
        width: 3.5rem;
        height: 1.75rem;
        cursor: pointer;
    }
    .custom-switch-lg .form-check-label {
        margin-left: 12px;
        padding-top: 4px;
        cursor: pointer;
        font-weight: 500;
    }

    /* Work Location Tile Styling */
    .location-card {
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        border: 2px solid #e9ecef;
        cursor: pointer;
        position: relative;
        background-color: white;
    }
    
    .btn-check:checked + .location-card.abroad {
        background-color: #0d6efd !important;
        color: white !important;
        border-color: #0a58ca;
        transform: translateY(-4px);
        box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
    }

    .btn-check:checked + .location-card.egypt {
        background-color: #0dcaf0 !important;
        color: white !important;
        border-color: #0bacbe;
        transform: translateY(-4px);
        box-shadow: 0 4px 15px rgba(13, 202, 240, 0.3);
    }

    .location-card:hover {
        border-color: #ced4da;
        background-color: #f8f9fa;
    }

    /* Magnificent Date Input Styling */
    .locked-date {
        background-color: #f8f9fa !important;
        border-right: none !important;
        font-weight: 600;
        color: #6c757d;
    }
    .unlocked-date {
        background-color: #fff9e6 !important;
        border: 2px solid #ffc107 !important;
        color: #000 !important;
    }
    .mode-container { overflow: hidden; }
</style>

<h1 class="mb-4 animate__animated animate__fadeInDown">📝 Add New Timesheet Task Entry</h1>

{% if messages %}
<div class="messages mb-4">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show animate__animated animate__fadeIn" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
</div>
{% endif %}

<div class="card shadow-sm animate__animated animate__fadeInUp border-0">
    <div class="card-body p-4">
        <form method="post" id="timesheetForm" >
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="id_project" class="form-label fw-bold">Project</label>
                    <select class="form-select" id="id_project" name="project" required>
                        <option selected disabled value="">Select a Project</option>
                        {% for project in projects %}
                        <option value="{{ project.pk }}">{{ project.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="id_task_type" class="form-label fw-bold">Task Type</label>
                    <select class="form-select" id="id_task_type" name="task_type">
                        <option value="Delivery">Delivery</option>
                        <option value="Pre-Sale">Pre-Sale</option>
                        <option value="study">Study / Training</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label for="id_task_description" class="form-label fw-bold">Task Description</label>
                <textarea class="form-control" id="id_task_description" name="task_description" rows="3" placeholder="What did you work on?" required></textarea>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <label class="form-label fw-bold mb-0 text-secondary"><i class="fas fa-map-marker-alt me-2"></i>Work Location</label>
                    <button type="button" class="btn btn-sm btn-link text-decoration-none p-0" onclick="document.querySelectorAll('.btn-check-location').forEach(el => el.checked = false);">Clear Selection</button>
                </div>
                <div class="row g-3">
                    <div class="col-md-12">
                        <input type="radio" class="btn-check btn-check-location" id="location_abroad" name="location" value="abroad">
                        <label class="location-card abroad btn w-100 py-3 d-flex align-items-center justify-content-center text-start" for="location_abroad">
                            <i class="fas fa-plane-departure fa-2x me-3"></i>
                            <div>
                                <span class="d-block fw-bold h5 mb-0">Onsite Abroad</span>
                                <small class="text-muted">International Travel</small>
                            </div>
                        </label>
                    </div>
                    <!-- <div class="col-md-6">
                        <input type="radio" class="btn-check btn-check-location" id="location_egypt" name="location" value="egypt">
                        <label class="location-card egypt btn w-100 py-3 d-flex align-items-center justify-content-center text-start" for="location_egypt">
                            <i class="fas fa-building fa-2x me-3"></i>
                            <div>
                                <span class="d-block fw-bold h5 mb-0">Onsite Egypt</span>
                                <small class="text-muted">Local Office / HQ</small>
                            </div>
                        </label>
                    </div> -->
                </div>
            </div>

            <hr class="my-4">

            <div class="mb-4">
                <label class="form-label fw-bold d-block text-secondary">Is this a future schedule?</label>
                <div class="form-check form-switch custom-switch-lg">
                    <input class="form-check-input" type="checkbox" id="is_scheduled_toggle" name="is_scheduled">
                    <label class="form-check-label text-muted" for="is_scheduled_toggle" id="toggle_label">
                        No, logging work done today
                    </label>
                </div>
            </div>
            
            <div class="mode-container">
                <div id="time_fields_container" class="row">
                    <div class="col-md-3 mb-3">
                        <label for="start_time" class="form-label fw-bold">Start Time</label>
                        <input type="time" class="form-control" id="start_time" name="start_time" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="end_time" class="form-label fw-bold">End Time</label>
                        <input type="time" class="form-control" id="end_time" name="end_time" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Work Date</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-calendar-check"></i></span>
                            <input type="date" class="form-control locked-date" id="log_work_date" name="work_date_logged" 
                                   value="{{ today|date:'Y-m-d' }}" readonly style="cursor: not-allowed;">
                            <button class="btn btn-outline-secondary" type="button" id="unlock_date_btn">
                                <i class="fas fa-edit me-1"></i> Log Past Date?
                            </button>
                        </div>
                        <small id="date_hint" class="text-muted mt-1 d-block">Defaulted to today.</small>
                    </div>
                </div>

                <div id="date_field_container" style="display: none;">
                    <div class="mb-3">
                        <label for="future_work_date" class="form-label fw-bold text-primary">
                            <i class="fas fa-calendar-alt me-1"></i> Choose Scheduled Future Date
                        </label>
                        <input type="date" class="form-control border-primary shadow-sm" id="future_work_date" name="work_date_scheduled">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-success btn-lg mt-4 w-100 shadow">
                <i class="fas fa-save me-2"></i> Save Entry
            </button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggle = document.getElementById('is_scheduled_toggle');
        const timeContainer = document.getElementById('time_fields_container');
        const dateContainer = document.getElementById('date_field_container');
        const toggleLabel = document.getElementById('toggle_label');
        
        const startInput = document.getElementById('start_time');
        const endInput = document.getElementById('end_time');
        const logDateInput = document.getElementById('log_work_date');
        const futureDateInput = document.getElementById('future_work_date');
        const unlockBtn = document.getElementById('unlock_date_btn');
        const dateHint = document.getElementById('date_hint');

        const todayValue = logDateInput.value;

        // Toggle logic: Future vs (Today/Past)
        toggle.addEventListener('change', function () {
            if (this.checked) {
                timeContainer.style.display = 'none';
                dateContainer.style.display = 'block';
                dateContainer.className = 'animate__animated animate__fadeInRight';
                toggleLabel.innerText = "Yes, scheduling for future";
                toggleLabel.classList.replace('text-muted', 'text-success');
                
                // Attributes
                startInput.required = false;
                endInput.required = false;
                futureDateInput.required = true;
                
                // Set min for future date
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                futureDateInput.min = tomorrow.toISOString().split('T')[0];
            } else {
                dateContainer.style.display = 'none';
                timeContainer.style.display = 'flex';
                timeContainer.className = 'row animate__animated animate__fadeInLeft';
                toggleLabel.innerText = "No, logging work done today";
                toggleLabel.classList.replace('text-success', 'text-muted');
                
                startInput.required = true;
                endInput.required = true;
                futureDateInput.required = false;
                
                resetLogDatePicker();
            }
        });

        // Unlock Past Date Logic
        unlockBtn.addEventListener('click', function() {
            if (logDateInput.readOnly) {
                // Unlock
                logDateInput.readOnly = false;
                logDateInput.classList.remove('locked-date');
                logDateInput.classList.add('unlocked-date');
                logDateInput.style.cursor = 'auto';
                logDateInput.max = todayValue; // Cannot pick future in "Log" mode
                logDateInput.focus();
                
                this.classList.replace('btn-outline-secondary', 'btn-warning');
                this.innerHTML = '<i class="fas fa-undo me-1"></i> Reset';
                dateHint.innerHTML = "Select a <strong>past date</strong> to log previous work.";
                dateHint.classList.replace('text-muted', 'text-warning');
            } else {
                resetLogDatePicker();
            }
        });

        function resetLogDatePicker() {
            logDateInput.readOnly = true;
            logDateInput.value = todayValue;
            logDateInput.classList.add('locked-date');
            logDateInput.classList.remove('unlocked-date');
            logDateInput.style.cursor = 'not-allowed';
            
            unlockBtn.classList.replace('btn-warning', 'btn-outline-secondary');
            unlockBtn.innerHTML = '<i class="fas fa-edit me-1"></i> Log Past Date?';
            dateHint.innerText = "Defaulted to today.";
            dateHint.classList.replace('text-warning', 'text-muted');
        }
    });
</script>
{% endblock %}
