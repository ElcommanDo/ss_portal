name: Mobile app - Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile_app.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project + apply overrides
        run: bash setup_android.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit / widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: smart-system-timesheet-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
